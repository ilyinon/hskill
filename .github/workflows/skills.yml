name: Skill quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks / Python 3.9
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: python scripts/check_skills.py --strict
      - run: python scripts/eval_skills.py validate
      - run: python -m unittest discover -s tests -v

  full:
    name: YAML and token budgets / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-check.txt
      - run: python -m pip install -r requirements-check.txt
      - name: Structure, references, and token growth
        run: >-
          python scripts/check_skills.py --tokens --strict
          --baseline tests/token_baseline.json
          --summary "$GITHUB_STEP_SUMMARY"
      - run: python scripts/eval_skills.py validate
      - run: python -m unittest discover -s tests -v
